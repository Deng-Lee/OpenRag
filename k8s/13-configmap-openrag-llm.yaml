# OpenAI 兼容网关：Embedding（DocumentProcessor / 检索）与 L1 LLM 导航（仅 API 检索路径）。
# 离线/内网请把 OPENAI_BASE_URL 改为集群内可达地址（通常含 /v1 后缀，与网关约定一致）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: openrag-llm-config
  namespace: openrag
data:
  OPENAI_BASE_URL: "http://litellm.dev.guozhijishu.com/v1"
  EMBEDDING_MODEL: "Qwen3-Embedding-4B"
  EMBEDDING_DIMENSION: "2560"
  # 上线前替换为模型注册表或服务端提供的不可变 revision/digest。
  EMBEDDING_REVISION: "CHANGE_ME_IMMUTABLE_MODEL_REVISION"
  EMBEDDING_MODEL_IDENTITY: "CHANGE_ME_IMMUTABLE_MODEL_IDENTITY"
  EMBEDDING_NORMALIZATION: "none"
  EMBEDDING_INPUT_TYPE: "text"
  EMBEDDING_ENCODING_FORMAT: "float"
  EMBEDDING_DISTANCE_METRIC: "COSINE"
  EMBEDDING_QUERY_PREFIX_REVISION: "none"
  EMBEDDING_DOCUMENT_PREFIX_REVISION: "none"
  EMBEDDING_TEXT_PREPROCESS_REVISION: "v1"
  EMBEDDING_SDK_CONTRACT_REVISION: "openai-v1"
  EMBEDDING_CONFIG_REF: "embedding/default"
  EMBEDDING_BATCH_SIZE: "8"
  EMBEDDING_TIMEOUT_SECONDS: "60"
  EMBEDDING_MAX_ATTEMPTS: "3"
  EMBEDDING_PROBE_INTERVAL_SECONDS: "30"
  L1_NAV_MODEL: "DeepSeek-V4-Flash"
