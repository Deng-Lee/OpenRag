apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openrag-api-uploads
  namespace: openrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: openrag
  labels:
    app: openrag-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: openrag-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-api
  namespace: openrag
  labels:
    app: openrag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openrag-api
  template:
    metadata:
      labels:
        app: openrag-api
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              until nc -z postgres 5432; do echo waiting postgres; sleep 2; done
              until nc -z elasticsearch 9200; do echo waiting elasticsearch; sleep 2; done
              until nc -z milvus 19530; do echo waiting milvus; sleep 2; done
              echo deps ready
      containers:
        - name: api
          image: openrag/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: openrag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              value: openrag
            - name: STORAGE_TYPE
              value: minio
            - name: STORAGE_ENDPOINT
              value: milvus-minio:9000
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MILVUS_HOST
              value: milvus
            - name: MILVUS_PORT
              value: "19530"
            - name: ELASTICSEARCH__ENABLED
              value: "true"
            - name: ELASTICSEARCH__HOSTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH__VERIFY_CERTS
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: SECRET_KEY
            - name: ALGORITHM
              value: HS256
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: MAX_UPLOAD_SIZE
              value: "20971520"
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: CORS_ORIGINS
              value: http://localhost
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: openrag-llm-config
                  key: OPENAI_BASE_URL
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: openrag-llm-config
                  key: EMBEDDING_MODEL
            - name: L1_NAV_MODEL
              valueFrom:
                configMapKeyRef:
                  name: openrag-llm-config
                  key: L1_NAV_MODEL
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: openrag-api-uploads
