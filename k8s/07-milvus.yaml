apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
  namespace: openrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: openrag
  labels:
    app: milvus
spec:
  type: ClusterIP
  ports:
    - port: 19530
      targetPort: 19530
      name: grpc
    - port: 9091
      targetPort: 9091
      name: health
  selector:
    app: milvus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: openrag
  labels:
    app: milvus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.17
          # args 会替换镜像的 CMD，须与 compose「milvus run standalone」一致；勿只写 run/standalone，否则 tini 会 exec「run」报 No such file
          args:
            - milvus
            - run
            - standalone
          env:
            - name: ETCD_ENDPOINTS
              value: milvus-etcd:2379
            - name: MINIO_ADDRESS
              value: milvus-minio:9000
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openrag-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: health
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "4"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: milvus-data
