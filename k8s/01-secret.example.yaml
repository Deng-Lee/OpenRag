# 复制为 01-secret.yaml 后修改 stringData，再 kubectl apply -f k8s/01-secret.yaml
# 切勿将真实密钥提交到版本库。
apiVersion: v1
kind: Secret
metadata:
  name: openrag-secrets
  namespace: openrag
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_POSTGRES_PASSWORD"
  SECRET_KEY: "CHANGE_ME_AT_LEAST_32_CHARS_RANDOM_SECRET_FOR_JWT"
  # External MinIO credentials for STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY.
  # Keep the real secret only in the deployed Secret, not in this example file.
  MINIO_ROOT_USER: "raguser"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_EXTERNAL_MINIO_SECRET_KEY"
  # Milvus uses the same external MinIO secret in this single-bucket topology.
  MILVUS_SECRET_KEY: "CHANGE_ME_EXTERNAL_MINIO_SECRET_KEY"
  MILVUS_RUNTIME_USER: "openrag-runtime"
  MILVUS_RUNTIME_PASSWORD: "CHANGE_ME_RUNTIME_PASSWORD"
  MILVUS_INDEX_ADMIN_USER: "openrag-index-admin"
  MILVUS_INDEX_ADMIN_PASSWORD: "CHANGE_ME_INDEX_ADMIN_PASSWORD"
  # Never mount cleanup credentials into API/Worker Pods; use a controlled Job only.
  MILVUS_CLEANUP_USER: "openrag-cleanup"
  MILVUS_CLEANUP_PASSWORD: "CHANGE_ME_CLEANUP_PASSWORD"
  # Embedding（入库/检索）与 L1 LLM 导航（chat）共用；本地网关可填任意占位或真实 sk
  OPENAI_API_KEY: "CHANGE_ME_EMBEDDING_GATEWAY_API_KEY"
