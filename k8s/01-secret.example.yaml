# 复制为 01-secret.yaml 后修改 stringData，再 kubectl apply -f k8s/01-secret.yaml
# 切勿将真实密钥提交到版本库。
apiVersion: v1
kind: Secret
metadata:
  name: openrag-secrets
  namespace: openrag
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_POSTGRES_PASSWORD"
  SECRET_KEY: "CHANGE_ME_AT_LEAST_32_CHARS_RANDOM_SECRET_FOR_JWT"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_MINIO_PASSWORD"
  # Embedding（入库/检索）与 L1 LLM 导航（chat）共用；本地网关可填任意占位或真实 sk
  OPENAI_API_KEY: ""
