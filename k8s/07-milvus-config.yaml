apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-config
  namespace: openrag
data:
  # Milvus v2.4.x Docker docs mount milvus.yaml at /milvus/configs/milvus.yaml.
  # Validate in the test environment that v2.4.17 logs show bucketName=rag-kb
  # and rootPath=milvus before applying this target Milvus configuration to production.
  # secretAccessKey is intentionally a placeholder. Deployment tooling must render
  # or replace it with the external MinIO secret, or rely on the Deployment's
  # MINIO_SECRET_ACCESS_KEY Secret env if verified to override this file value.
  milvus.yaml: |
    minio:
      address: 172.16.31.63
      port: 9000
      accessKeyID: raguser
      secretAccessKey: CHANGE_ME_EXTERNAL_MINIO_SECRET_KEY
      bucketName: rag-kb
      rootPath: milvus
      useSSL: false
