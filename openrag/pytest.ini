[pytest]
testpaths = tests
# Repo root contains `common/`; `src/` contains `openrag/` (pytest 7+).
pythonpath =
    .
    src
# 本仓库子集仅保证下列契约用例稳定；其余历史测试依赖未随包发布的模块，默认不参与收集。
python_files =
    test_service_token_*.py
    test_service_api.py
    test_service_tokens_admin.py
    test_workspace_file_tree.py
    test_workspace_es_slug.py
    test_files_api.py
    test_*_parity.py
