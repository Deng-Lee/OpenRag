services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: openrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrag_pass}
      POSTGRES_DB: ${POSTGRES_DB:-openrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrag -d openrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus Standalone (Vector Database)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: openrag-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: openrag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9001}:9001"
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 与 pymilvus 2.4+ 协议一致；2.3 服务端 + 2.6 客户端会触发搜索解析错误（Unsupported field type: 0）
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: openrag-milvus
    restart: unless-stopped
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

  # Elasticsearch (optional full-text chunk index per workspace slug)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: openrag-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Internal Trace / Eval dashboard (optional)
  trace-dashboard:
    build:
      context: ..
      dockerfile: tools/trace_dashboard/Dockerfile
    container_name: openrag-trace-dashboard
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-openrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrag_pass}
      POSTGRES_DB: ${POSTGRES_DB:-openrag}
    ports:
      - "${TRACE_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openrag-network

networks:
  openrag-network:
    driver: bridge
    name: openrag-network
    external: false

volumes:
  postgres_data:
    name: openrag-postgres-data
  etcd_data:
    name: openrag-etcd-data
  minio_data:
    name: openrag-minio-data
  milvus_data:
    name: openrag-milvus-data
  elasticsearch_data:
    name: openrag-elasticsearch-data
