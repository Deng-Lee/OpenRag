services:
  # API Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: openrag-api-prod
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=openrag
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=openrag
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_RUNTIME_USER=${MILVUS_RUNTIME_USER}
      - MILVUS_RUNTIME_PASSWORD=${MILVUS_RUNTIME_PASSWORD}
      - MILVUS_INDEX_ADMIN_USER=${MILVUS_INDEX_ADMIN_USER}
      - MILVUS_INDEX_ADMIN_PASSWORD=${MILVUS_INDEX_ADMIN_PASSWORD}
      - ELASTICSEARCH__ENABLED=${ELASTICSEARCH__ENABLED:-true}
      - ELASTICSEARCH__HOSTS=${ELASTICSEARCH__HOSTS:-http://elasticsearch:9200}
      - ELASTICSEARCH__VERIFY_CERTS=${ELASTICSEARCH__VERIFY_CERTS:-false}
      - ELASTICSEARCH__HYBRID_RECALL_MODE=${ELASTICSEARCH__HYBRID_RECALL_MODE:-legacy}
      - ELASTICSEARCH__CHUNK_INDEX_MODE=${ELASTICSEARCH__CHUNK_INDEX_MODE:-legacy}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-104857600}
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - PREVIEW_PUBLIC_WEB_BASE_URL=${PREVIEW_PUBLIC_WEB_BASE_URL:-https://openrag.guozhijishu.com}
      - PREVIEW_TOKEN_TTL_SECONDS=${PREVIEW_TOKEN_TTL_SECONDS:-900}
      - PREVIEW_TOKEN_MAX_TTL_SECONDS=${PREVIEW_TOKEN_MAX_TTL_SECONDS:-1800}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://litellm.guozhijishu.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen3-Embedding-4B}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - EMBEDDING_REVISION=${EMBEDDING_REVISION:-}
      - EMBEDDING_MODEL_IDENTITY=${EMBEDDING_MODEL_IDENTITY:-}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-8}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-60}
      - EMBEDDING_MAX_ATTEMPTS=${EMBEDDING_MAX_ATTEMPTS:-3}
      - EMBEDDING_PROBE_INTERVAL_SECONDS=${EMBEDDING_PROBE_INTERVAL_SECONDS:-30}
      - OPENRAG_RETRIEVAL_USE_L0_L1=${OPENRAG_RETRIEVAL_USE_L0_L1:-true}
      - L1_NAV_API_KEY=${L1_NAV_API_KEY:-}
      - L1_NAV_BASE_URL=${L1_NAV_BASE_URL:-}
      - L1_NAV_MODEL=${L1_NAV_MODEL:-youfu/Qwen3.6-35B-A3B}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-local}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - RERANKER_PAYLOAD_FORMAT=${RERANKER_PAYLOAD_FORMAT:-}
      - RERANKER_MAX_DOCUMENTS=${RERANKER_MAX_DOCUMENTS:-}
      - RERANKER_TIMEOUT=${RERANKER_TIMEOUT:-30}
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Frontend Service
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: openrag-web-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - PREVIEW_FRAME_ANCESTORS=${PREVIEW_FRAME_ANCESTORS:-'self' http://192.168.100.33:2026 http://192.168.100.32:2026 http://172.16.31.61:2026 http://172.16.31.156:2026}
    depends_on:
      - api
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Internal Trace / Eval dashboard. Expose only in trusted networks.
  # Opt-in only: gated behind the `trace-dashboard` profile so a plain
  # `docker compose up` does NOT start it. Enable with `--profile trace-dashboard`.
  trace-dashboard:
    profiles:
      - trace-dashboard
    build:
      context: ..
      dockerfile: tools/trace_dashboard/Dockerfile
    container_name: openrag-trace-dashboard-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: openrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: openrag
    ports:
      - "${TRACE_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openrag-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: openrag-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: openrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openrag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrag -d openrag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Milvus Dependencies
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: openrag-milvus-etcd-prod
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: openrag-milvus-minio-prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 与 pymilvus 2.4+ 一致；勿与 2.3 镜像混用以免 SDK 解析失败
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: openrag-milvus-prod
    restart: unless-stopped
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # Elasticsearch (chunk fulltext; index per workspace slug)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: openrag-elasticsearch-prod
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - openrag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Task Worker - pulls tasks from broker and processes documents
  task-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: openrag-task-worker
    restart: unless-stopped
    environment:
      - WORKER_API_URL=http://api:8000
      - WORKER_NUM=4
      - WORKER_PREFIX=worker
      - WORKER_BATCH_SIZE=5
      - WORKER_POLL_INTERVAL=5
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=openrag
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=openrag
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_RUNTIME_USER=${MILVUS_RUNTIME_USER}
      - MILVUS_RUNTIME_PASSWORD=${MILVUS_RUNTIME_PASSWORD}
      - ELASTICSEARCH__ENABLED=${ELASTICSEARCH__ENABLED:-true}
      - ELASTICSEARCH__HOSTS=${ELASTICSEARCH__HOSTS:-http://elasticsearch:9200}
      - ELASTICSEARCH__VERIFY_CERTS=${ELASTICSEARCH__VERIFY_CERTS:-false}
      - ELASTICSEARCH__HYBRID_RECALL_MODE=${ELASTICSEARCH__HYBRID_RECALL_MODE:-legacy}
      - ELASTICSEARCH__CHUNK_INDEX_MODE=${ELASTICSEARCH__CHUNK_INDEX_MODE:-legacy}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://litellm.guozhijishu.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen3-Embedding-4B}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - EMBEDDING_REVISION=${EMBEDDING_REVISION:-}
      - EMBEDDING_MODEL_IDENTITY=${EMBEDDING_MODEL_IDENTITY:-}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-8}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-60}
      - EMBEDDING_MAX_ATTEMPTS=${EMBEDDING_MAX_ATTEMPTS:-3}
      - EMBEDDING_PROBE_INTERVAL_SECONDS=${EMBEDDING_PROBE_INTERVAL_SECONDS:-30}
      - OPENRAG_RETRIEVAL_USE_L0_L1=${OPENRAG_RETRIEVAL_USE_L0_L1:-true}
      - OPENRAG_PDF_BACKEND=${OPENRAG_PDF_BACKEND:-ragflow}
      - PADDLEOCR_SERVER_URL=${PADDLEOCR_SERVER_URL:-}
      - OPENRAG_CHUNK_SIZE=${OPENRAG_CHUNK_SIZE:-600}
      - OPENRAG_CHUNK_OVERLAP=${OPENRAG_CHUNK_OVERLAP:-80}
      - OPENRAG_MIN_CHUNK_TOKENS=${OPENRAG_MIN_CHUNK_TOKENS:-32}
    depends_on:
      api:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - openrag-network

volumes:
  postgres-data:
    driver: local
  milvus-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local
  api-uploads:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  openrag-network:
    driver: bridge

